global
    node-ips 10.0.0.1 10.0.0.2
    bind [::]:443 ssl crt /certs v4v6
    backend-addr 127.0.0.1:8080
    # literal percent signs must survive: %[var(txn.trace_id)] %s %20

frontend main
    log-level info
    host-regex \.one\.example\.test|\.two\.example\.test$
    main-server one.example.test
    server-alternatives one.example.test|two.example.test
option httpchk GET /healthcheck/test

backend srv1
    server one.example.test one.example.test:443
    redirect https://www.example.test

backend srv2
    server two.example.test two.example.test:443

node 00 addr 10.0.0.1:443
node 01 addr 10.0.0.2:443
